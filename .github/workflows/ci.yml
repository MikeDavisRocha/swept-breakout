name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cross-engine:
    # The only job here that can falsify the project's replay claim. Node and
    # Chrome are both V8, so a green suite locally says nothing about whether a
    # run reproduces in Safari — and the first time this ran, it did not. See
    # ADR 0003.
    name: replay reproduces off V8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run cross-engine
